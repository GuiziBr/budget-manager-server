name: CI

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]

jobs:
  tests:
    name: Build & Test
    runs-on: ubuntu-latest

    env:
      PORT: 3000
      DATABASE_URL: postgresql://admin:admin@budget-manager-db:5432/expenses?schema=public

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scanning
        uses: trufflesecurity/trufflehog@v3.88.18
        with:
          extra_args: --only-verified
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:cov
