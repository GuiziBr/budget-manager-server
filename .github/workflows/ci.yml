name: CI

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]

jobs:
  tests:
    name: Build & Test
    runs-on: ubuntu-latest

    env:
      PORT: 3000
      DATABASE_URL: postgresql://admin:admin@budget-manager-db:5432/expenses?schema=public
      EXPENSE_API_URL: http://localhost:4000
      EXPENSE_API_KEY: ci-api-key
      EXPENSE_API_USER_ID: 00000000-0000-4000-8000-000000000000

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Secret Scanning
        uses: trufflesecurity/trufflehog@v3.99.8
        with:
          extra_args: --only-verified
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:cov
