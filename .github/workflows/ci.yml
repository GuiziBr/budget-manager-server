name: CI

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]

jobs:
  unit-tests:
    name: Build & Test
    runs-on: ubuntu-latest

    env:
      PORT: 3000
      DATABASE_URL: postgresql://admin:admin@budget-manager-db:5432/expenses?schema=public

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:cov
